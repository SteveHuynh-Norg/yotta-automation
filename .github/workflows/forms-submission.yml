name: forms-submission

# CI/CD for the contact-form submission suite.
#
# This is SEPARATE from the directory-verification `CI` workflow because a run
# sends a REAL (clearly self-identified) enquiry through the live form, and it
# needs the reCAPTCHA bypass secret.
#
# Triggers:
#   - push / pull_request that touch form-submission code → verify the suite
#     here, NOT in the directory CI (which ignores these same paths)
#   - schedule          → weekly full-estate health check
#   - workflow_dispatch → manual run (or one form via `form`)
#
# Every run exercises the full estate serially, EXCLUDING the @bnd-tagged
# Cloudflare zones — those reject the runner's datacenter IP (pending a dev-side
# allowlist, Monday item 2702399641); they pass on a local run, which has no
# such exclusion.
on:
  push:
    branches: [main]
    paths:
      - 'tests/form-submission.spec.ts'
      - 'config/forms.ts'
      - 'src/pages/ContactPage.ts'
      - 'src/pages/BasePage.ts'
      - 'src/utils/qaBypass.ts'
      - 'src/types/index.ts'
      - 'fixtures/test-fixtures.ts'
      - 'playwright.config.ts'
      - '.github/workflows/forms-submission.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tests/form-submission.spec.ts'
      - 'config/forms.ts'
      - 'src/pages/ContactPage.ts'
      - 'src/pages/BasePage.ts'
      - 'src/utils/qaBypass.ts'
      - 'src/types/index.ts'
      - 'fixtures/test-fixtures.ts'
      - 'playwright.config.ts'
      - '.github/workflows/forms-submission.yml'
  schedule:
    # Target: the FIRST MONDAY of each month at 07:30 ICT (GMT+7) == 00:30 UTC.
    #
    # cron cannot express "first Monday": when both day-of-month and day-of-week
    # are restricted, cron ORs them, so '30 0 1-7 * 1' would fire on days 1-7
    # AND on every Monday. Instead we wake every Monday and let the `gate` job
    # below drop the run unless the date is 1-7 (i.e. the month's first Monday).
    - cron: '30 0 * * 1'
  workflow_dispatch:
    inputs:
      form:
        description: 'Run only one form by key (blank = all enabled forms)'
        required: false
        default: ''

# Never run two form submissions concurrently — keep enquiries serialised.
concurrency:
  group: forms-submission-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Turns the weekly-Monday cron into "first Monday of the month" (see the
  # `schedule` note above for why cron alone can't). Only gates scheduled runs —
  # push / PR / manual dispatch always proceed.
  gate:
    name: First-Monday-of-month check
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" != 'schedule' ]; then
            echo 'Not a scheduled run — proceeding.'
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The cron fires at 00:30 UTC, so the UTC date is the same calendar day
          # as 07:30 ICT — no timezone correction needed. A Monday falling on the
          # 1st-7th is by definition the month's first Monday.
          dom=$(date -u +%-d)
          dow=$(date -u +%u)
          if [ "$dow" = '1' ] && [ "$dom" -le 7 ]; then
            echo "$(date -u +%Y-%m-%d) is the first Monday of the month — running."
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo "$(date -u +%Y-%m-%d) is not the first Monday of the month — skipping."
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi

  submit:
    name: Verify contact form submission
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    # Forms run serially (--workers=1) to avoid the rate-related flakiness the
    # estate shows under parallel load; the full sweep is ~75 forms, so allow
    # generous headroom over the previous 20m (which the full run exceeded).
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser (Chromium)
        run: npx playwright install --with-deps chromium

      # Logs the runner's public egress IP + UTC time so the dev can correlate a
      # run against Cloudflare Security Events (the runner IP rotates per run and
      # isn't otherwise exposed). Diagnostic aid for the BND edge-block issue.
      - name: Print runner public IP
        run: |
          echo "Runner public IP: $(curl -s --max-time 10 https://api.ipify.org || echo unknown)"
          echo "UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Run form-submission test
        env:
          # Shared HMAC secret for the reCAPTCHA QA bypass (from qa-bypass-url.sh).
          # Stored as a repo/Actions secret — never committed.
          QA_BYPASS_SECRET: ${{ secrets.QA_BYPASS_SECRET }}
          # Static token for the X-QA-Bypass header (gets the browser past
          # Cloudflare Bot Fight Mode on the BND zones). Stored as an Actions secret.
          QA_BYPASS_HEADER: ${{ secrets.QA_BYPASS_HEADER }}
          FORM: ${{ github.event.inputs.form }}
          # Posts the run summary to Slack (no-op when the secret is unset).
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        # Default: full estate, serial (--workers=1), one retry to absorb the
        # rate-related flakiness the estate shows under parallel load. Exclude
        # @bnd: the Cloudflare BND zones reject this runner's datacenter IP (they
        # pass locally). Drop `--grep-invert @bnd` once the dev allowlists the
        # runner (Monday item 2702399641).
        #
        # When a `form` is given on a manual dispatch, run just that one form
        # INCLUDING @bnd, single attempt (--retries=0) — e.g. to fire exactly one
        # CI POST at a BND zone for the dev's diagnostics. (FORM already narrows
        # the suite to that key, so no @bnd exclusion is needed.)
        run: |
          if [ -n "${FORM:-}" ]; then
            echo "Targeted single-form run: $FORM (incl. @bnd; one attempt)"
            npx playwright test --grep @forms --workers=1 --retries=0
          else
            npx playwright test --grep @forms --grep-invert @bnd --workers=1 --retries=1
          fi

      - name: Upload Playwright HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: forms-submission-report
          path: playwright-report/
          retention-days: 14
